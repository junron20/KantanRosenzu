<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>東京 かんたん路線図</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="./styles.css"/><link rel="stylesheet" href="./data.css"/></head>
<body><main class="app-shell"><aside class="sidebar">
  <a class="brand" href="#"><span class="brand-mark">↗</span><span>かんたん<br/>路線図</span></a><div class="location"><span class="live-dot"></span> 東京 · 交通路線図</div>
  <h1>東京の移動を、<br/><em>ひと目で。</em></h1><p class="intro">JRを中心に、主要な地下鉄・道路・観光スポットを見やすくまとめた模式路線図です。</p>
  <section class="search-wrap"><label for="search">駅・スポットを検索</label><div class="search-box"><span>⌕</span><input id="search" placeholder="東京駅、浅草、上野…"/></div></section>
  <section class="panel"><div class="section-title"><span>表示レイヤー</span><button id="clear">すべて表示</button></div>
    <label class="toggle"><input type="checkbox" checked data-layer="rail"/><span class="check"></span><span class="swatch rail"></span>鉄道駅 <small id="station-total">読込中</small></label>
    <label class="toggle"><input type="checkbox" checked data-layer="labels"/><span class="check"></span><span class="swatch air"></span>駅名 <small>表示</small></label>
    <label class="toggle"><input type="checkbox" checked data-layer="connections"/><span class="check"></span><span class="civic-sample">◆</span>乗換駅 <small>表示</small></label></section>
  <section class="panel lines"><div class="section-title"><span>路線を絞り込む</span></div><div id="route-list"></div></section>
  <footer>試作版 · 本番では公式データとの照合が必要です<br/>東京の移動を、もっとわかりやすく</footer>
</aside><section class="map-area"><header class="map-header"><div><span class="eyebrow">INTERACTIVE TRANSIT MAP</span><strong>東京・JR主要路線図</strong></div><div class="header-actions"><button id="zoom-out" aria-label="縮小">−</button><span id="zoom-status" aria-live="polite">100%</span><button id="zoom-in" aria-label="拡大">+</button><button id="reset-view" class="reset-view" aria-label="地図表示をリセット">⌖</button></div></header>
<div class="map-legend"><span><i class="legend rail"></i>JR東日本</span><span><i class="legend seibu"></i>西武鉄道</span><span><i class="legend metro" style="background:#b5b5b5"></i>東京メトロ</span><span><i class="legend civic"></i>乗換駅</span></div>
<div class="map-stage" id="stage" tabindex="0" role="application" aria-label="駅マップ。ドラッグで移動、ホイールまたはピンチで拡大縮小。"><div class="map-gesture-hint">ドラッグで移動　·　ホイール／ピンチで拡大　·　⌖でリセット</div><svg id="map" viewBox="0 0 1200 760" aria-label="東京の鉄道駅マップ"></svg>
<article class="info-card" id="info"><button id="close-card">×</button><span class="card-type">駅を選択</span><h2>駅データを準備しています</h2><p>駅をクリックすると、所属路線と接続を表示します。</p><div class="card-tags"><span>読込中</span></div></article><section id="station-drawer" class="station-drawer"><div class="drawer-head"><strong>駅一覧</strong><span id="result-count"></span></div><div id="station-list"></div></section><div class="north">北 <span>↑</span></div><div class="scale" id="source-label">— データを読み込み中 —</div></div></section></main><script defer src="./data/tokyo-jr-stations.js?v=20260802-3"></script><script defer src="./app.js?v=20260802-5"></script></body></html>
