<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>東京 かんたん路線図</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="./styles.css?v=20260816-1"/><link rel="stylesheet" href="./data.css?v=20260816-1"/><link rel="stylesheet" href="./layout.css?v=20260816-1"/></head>
<body><main class="map-area map-area--fullscreen"><div class="map-stage" id="stage" tabindex="0" role="application" aria-label="駅マップ。ドラッグで移動、ホイールまたはピンチで拡大縮小。"><svg id="map" viewBox="0 0 1200 760" aria-label="東京の鉄道駅マップ"></svg>
  <div class="map-controls"><div class="map-controls__brand"><span class="brand-mark">↗</span><span>かんたん<br/>路線図</span></div><section class="filter-panel" aria-label="地図の絞り込み"><div class="filter-panel__head"><span>地図を絞り込む</span><button id="clear" type="button">リセット</button></div><label class="search-wrap" for="search">駅・路線を検索<span class="search-box"><span>⌕</span><input id="search" placeholder="東京駅、浅草、山手線…"/></span></label><div class="filter-section"><span class="filter-label">表示</span><label class="toggle"><input type="checkbox" checked data-layer="rail"/><span class="check"></span><span class="swatch rail"></span>鉄道路線</label><label class="toggle"><input type="checkbox" checked data-layer="labels"/><span class="check"></span><span class="swatch air"></span>駅名</label></div><div class="filter-section filter-routes"><span class="filter-label">路線</span><div id="route-list"></div></div></section></div>
  <div class="map-gesture-hint">ドラッグで移動　·　ホイール／ピンチで拡大</div><div class="map-legend"><span><i class="route-sign" style="--route-color:#8ebe4a" aria-hidden="true">JY</i>JR東日本</span><span><i class="route-sign" style="--route-color:#e85f25" aria-hidden="true">SI</i>西武鉄道</span><span><i class="route-sign" style="--route-color:#f4a832" aria-hidden="true">G</i>東京メトロ</span></div><div class="header-actions map-zoom"><button id="zoom-out" aria-label="縮小">−</button><span id="zoom-status" aria-live="polite">100%</span><button id="zoom-in" aria-label="拡大">+</button><button id="reset-view" class="reset-view" aria-label="地図表示をリセット">⌖</button></div>
  <article class="info-card hidden" id="info"><button id="close-card" aria-label="閉じる">×</button><span class="card-type">駅を選択</span><h2>駅データを準備しています</h2><p>駅をクリックすると、所属路線と接続を表示します。</p><div class="card-tags"><span>読込中</span></div></article><div class="north">北 <span>↑</span></div><div class="scale" id="source-label">— データを読み込み中 —</div></div></main><script defer src="./data/tokyo-jr-stations.js?v=20260802-3"></script><script defer src="./app.js?v=20260816-14"></script></body></html>
